<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Pet | 오프라인</title>
    <meta name="theme-color" content="#cfe8ff" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: linear-gradient(180deg, #eef7ff 0%, #ffffff 100%);
        color: #0f172a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: min(100%, 420px);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #dbeafe;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 104px;
        height: 104px;
        border-radius: 28px;
        box-shadow: 0 12px 32px rgba(14, 116, 144, 0.18);
      }
      h1 {
        margin: 20px 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #475569;
      }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #38bdf8;
        color: white;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 14px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="Todo Pet 아이콘" />
      <h1>지금은 오프라인 상태입니다</h1>
      <p>네트워크가 복구되면 최신 데이터를 다시 가져옵니다.</p>
      <p>설치된 앱에서는 마지막으로 캐시된 화면과 에셋을 계속 사용할 수 있습니다.</p>
      <button type="button" onclick="window.location.reload()">다시 시도</button>
    </main>
  </body>
</html>
